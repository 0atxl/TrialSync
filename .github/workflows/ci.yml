name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install --editable "backend[dev,research]"

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Install document extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils tesseract-ocr

      - name: Create ephemeral CI environment file
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql+psycopg://test:test@127.0.0.1:5432/test' \
            'TRIALSYNC_ENVIRONMENT=test' \
            'TRIALSYNC_AUTH_SECRET=ci-only-secret-that-is-at-least-32-characters-long' \
            'TRIALSYNC_CORS_ORIGINS=["http://localhost:5173"]' \
            'TRIALSYNC_EXTRACTION_PROVIDER=rule_based' \
            'TRIALSYNC_SCREENING_CHAT_PROVIDER=canonical' \
            'TRIALSYNC_TERMINOLOGY_SUGGESTIONS_ENABLED=false' \
            > .env

      - name: Run repository verification gate
        run: make verify

      - name: Audit dependencies
        run: make audit

  container-build:
    name: Build application images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag trialsync-backend:ci .

      - name: Build frontend image
        run: >-
          docker build
          --file web/Dockerfile
          --build-arg VITE_API_BASE_URL=/api/v1
          --tag trialsync-frontend:ci
          .
