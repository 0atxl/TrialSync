[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "trialsync"
version = "0.1.0"
description = "Foundation for the TrialSync academic pre-screening prototype"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "email-validator==2.2.0",
  "fastapi==0.139.0",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pypdf==6.15.0",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.10.1",
  "reportlab==5.0.0",
  "sqlalchemy[asyncio]==2.0.51",
  "starlette==1.3.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.0",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.16.2",
]
research = [
  "data-designer==0.8.0",
]
research-r6 = [
  "faiss-cpu==1.15.0",
  "numpy==2.5.1",
  "pandas==2.3.3",
  "pyarrow==24.0.0",
  "scikit-learn==1.6.1",
  "scipy==1.18.0",
]
research-runtime = [
  "faiss-cpu==1.15.0",
  "numpy==2.5.1",
]
research-risk = [
  "joblib==1.5.3",
  "pandas==2.3.3",
  "scikit-learn==1.6.1",
  "xgboost-cpu==3.2.0",
]

[project.scripts]
trialsync-demo = "trialsync.demo:main"
trialsync-evaluate = "trialsync.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trialsync", "research"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trialsync"]
plugins = ["pydantic.mypy"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR"]

[[tool.mypy.overrides]]
module = [
  "data_designer",
  "data_designer.*",
  "faiss",
  "faiss.*",
  "joblib",
  "joblib.*",
  "pandas",
  "pandas.*",
  "pyarrow",
  "pyarrow.*",
  "sklearn",
  "sklearn.*",
  "xgboost",
  "xgboost.*",
]
ignore_missing_imports = true
