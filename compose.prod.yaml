name: trialsync

services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [trialsync]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: trialsync-backend:local
    env_file: ${TRIALSYNC_ENV_FILE:-.env.production}
    command: ["alembic", "-c", "/app/backend/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [trialsync]

  backend:
    image: trialsync-backend:local
    env_file: ${TRIALSYNC_ENV_FILE:-.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [trialsync]

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    networks: [trialsync]

networks:
  trialsync:
    driver: bridge

volumes:
  postgres_data:
